name: Refactor AstrBot runtime ownership

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/shrink-astrbot-runtime-ownership'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shrink-astrbot-runtime-ownership
          fetch-depth: 0
      - name: Correct temporary refactor patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/refactor_astrbot_ownership.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '"star_map", "star_registry", "star_handlers_registry", "_remove_runtime_registrations"',
              '"star_map.pop", "star_registry.remove", "star_handlers_registry.remove", "_remove_runtime_registrations"',
          )
          old_start = 'i = r.find("_RUNTIME_MODULE = RuntimeContractFileRouter.__module__\\n")\n'
          old_end = 'r = r[:i] + r[j:]\n'
          start = text.find(old_start)
          end = text.find(old_end, start)
          if start < 0 or end < 0:
              raise SystemExit('old File Router patch block not found')
          end += len(old_end)
          bsn = chr(92) + 'n'
          replacement = '\n'.join([
              'r = once(',
              '    r,',
              f'    "_RUNTIME_MODULE = RuntimeContractFileRouter.__module__{bsn}",',
              '    "",',
              '    "router runtime module marker",',
              ')',
              f'start = r.find("{bsn}def _remove_runtime_registrations() -> None:{bsn}")',
              f'end_marker = "{bsn}{bsn}_remove_runtime_registrations(){bsn}"',
              'end = r.find(end_marker, start)',
              'if start < 0 or end < 0:',
              '    raise RuntimeError("router registry repair function not found")',
              f'r = r[:start] + "{bsn}" + r[end + len(end_marker):]',
              '',
          ])
          text = text[:start] + replacement + text[end:]
          bs = chr(92)
          validator_old = f'raise SystemExit("{bs}n".join(errors))'
          validator_new = f'raise SystemExit("{bs}{bs}n".join(errors))'
          if validator_old not in text:
              raise SystemExit('validator newline template not found')
          text = text.replace(validator_old, validator_new, 1)
          duplicate_class = f'    "class _BoundCorpusTool(FunctionTool):{bsn}",'
          if text.count(duplicate_class) != 1:
              raise SystemExit('BoundCorpusTool splice target not unique')
          text = text.replace(duplicate_class, '    "",', 1)
          duplicate_builder = '    skill_state + "    def _build_runtime_tools",'
          if text.count(duplicate_builder) != 1:
              raise SystemExit('runtime builder splice target not unique')
          text = text.replace(duplicate_builder, '    skill_state,', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply ownership refactor
        run: python .github/scripts/refactor_astrbot_ownership.py
      - name: Validate ownership boundary
        run: |
          python scripts/validate_astrbot_ownership.py
          git diff --check
          python -m compileall -q plugins scripts
      - name: Build release
        run: python scripts/build_release.py --clean
      - name: Commit validated refactor
        run: |
          rm -f .ownership-refactor-trigger
          rm -f .github/scripts/refactor_astrbot_ownership.py
          rm -f .github/workflows/refactor-astrbot-ownership.yml
          git config user.name "contractbot-ci"
          git config user.email "contractbot-ci@users.noreply.github.com"
          git add -A
          git commit -m "Shrink AstrBot runtime ownership"
          git push origin HEAD:agent/shrink-astrbot-runtime-ownership
