name: PR20 review fixes

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'agent/fix-builder-skill-runtime' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-builder-skill-runtime
          fetch-depth: 0

      - name: Apply deterministic fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          path = Path('plugins/astrbot_plugin_contract_generation_flow/main.py')
          text = path.read_text(encoding='utf-8')

          text = replace_once(
              text,
              'from astrbot.core.skills.skill_manager import SkillInfo, SkillManager, build_skills_prompt',
              'from astrbot.core.skills.skill_manager import SkillInfo, SkillManager',
              'remove build_skills_prompt import',
          )

          text = replace_once(
              text,
              '''        skill = self._resolve_skill(event, skill_name)\n        if skill is None:\n''',
              '''        try:\n            skill = self._resolve_skill(event, skill_name)\n        except Exception:\n            logger.exception(\n                "Contract generation flow: failed to resolve bound Skill %s",\n                skill_name,\n            )\n            return _normalized_tool_failure(\n                failure_stage="skill_grounding",\n                error=f"Skill {skill_name} 的运行时状态读取失败。",\n            )\n        if skill is None:\n''',
              'guard read_bound_skill resolution',
          )

          start = text.index('    @staticmethod\n    def _strip_skill_runtime_block')
          end = text.index('    def _build_runtime_tools', start)
          replacement = '''    def _bound_skill_infos(\n        self,\n        event: AstrMessageEvent,\n    ) -> tuple[list[str], list[SkillInfo], list[str]]:\n        bound_names = _builder_bound_skill_names(self._context)\n        runtime = _runtime_name(self._context, event)\n        active = self._skill_manager.list_skills(\n            active_only=True,\n            runtime=runtime,\n            show_sandbox_path=False,\n        )\n        active_by_name = {skill.name: skill for skill in active}\n        selected = [\n            active_by_name[name]\n            for name in bound_names\n            if name in active_by_name\n        ]\n        missing = [name for name in bound_names if name not in active_by_name]\n        return bound_names, selected, missing\n\n    @staticmethod\n    def _restricted_skill_runtime_block(skill_infos: list[SkillInfo]) -> str:\n        inventory_lines: list[str] = []\n        for skill in skill_infos:\n            name = str(skill.name or "").strip()\n            if not name:\n                continue\n            description = " ".join(str(skill.description or "").replace("`", "").split())\n            description = description[:1000] or "Read the bound SKILL.md for details."\n            inventory_lines.append(f"- **{name}**: {description}")\n        inventory = "\\n".join(inventory_lines) or "- (no active bound Skills)"\n        return (\n            f"{SKILL_RUNTIME_BEGIN}\\n"\n            "### Contract Builder bound Skills\\n\\n"\n            "This inventory is derived from the current Builder Persona binding and "\n            "AstrBot SkillManager. It applies only to this handoff request.\\n\\n"\n            f"{inventory}\\n\\n"\n            "Restricted Skill rules:\\n"\n            "1. If the task matches a listed Skill, use it; never silently skip it.\\n"\n            "2. Before applying a listed Skill, call `read_bound_skill` with the exact "\n            "Skill name. That tool is the only Skill grounding path in this Builder runtime.\\n"\n            "3. Do not use Shell, Python, generic HTTP, arbitrary file reads/writes, Grep, "\n            "or raw MCP to load Skill files. Those capabilities are intentionally unavailable.\\n"\n            "4. If a required Skill is unavailable or cannot be grounded, do not claim READY; "\n            "the generation write gate will fail closed before DOCX publication.\\n"\n            f"{SKILL_RUNTIME_END}"\n        )\n\n    @staticmethod\n    def _skill_runtime_failure_block() -> str:\n        return (\n            f"{SKILL_RUNTIME_BEGIN}\\n"\n            "### Contract Builder Skill runtime unavailable\\n\\n"\n            "The Builder Skill inventory could not be resolved for this handoff. Do not claim "\n            "successful formal generation. The restricted generation tools remain installed and "\n            "the document-specification write gate will fail closed before any DOCX/publication "\n            "write. Do not use Shell, Python, generic HTTP or arbitrary file tools as a fallback.\\n"\n            f"{SKILL_RUNTIME_END}"\n        )\n\n    def _prepare_builder_skill_runtime(\n        self,\n        event: AstrMessageEvent,\n    ) -> tuple[str, list[str]]:\n        bound_names, skill_infos, missing_skills = self._bound_skill_infos(event)\n        runtime_missing: list[str] = []\n        if DOCUMENT_SPEC_SKILL_NAME not in bound_names:\n            runtime_missing.append("builder_document_spec_binding")\n        available = any(skill.name == DOCUMENT_SPEC_SKILL_NAME for skill in skill_infos)\n        event.set_extra("contract_generation_document_spec_available", available)\n        if DOCUMENT_SPEC_SKILL_NAME in bound_names and not available:\n            runtime_missing.append("builder_document_spec_skill")\n        for name in missing_skills:\n            marker = f"builder_skill:{name}"\n            if marker not in runtime_missing:\n                runtime_missing.append(marker)\n        return self._restricted_skill_runtime_block(skill_infos), runtime_missing\n\n    @staticmethod\n    def _prepend_skill_runtime_input(\n        tool_args: dict[str, Any],\n        runtime_block: str,\n    ) -> None:\n        original = tool_args.get("input")\n        if isinstance(original, str):\n            handoff_input = original\n        elif isinstance(original, dict):\n            handoff_input = _tool_json(original)\n        elif original is None:\n            handoff_input = ""\n        else:\n            handoff_input = str(original)\n        tool_args["input"] = (\n            f"{runtime_block}\\n\\n"\n            "<contract_generation_handoff_input>\\n"\n            f"{handoff_input}\\n"\n            "</contract_generation_handoff_input>"\n        )\n\n'''
          text = text[:start] + replacement + text[end:]

          text = replace_once(
              text,
              '''            "contract_generation_skill_grounding_loaded": [],\n            "contract_generation_write_stage": "",\n''',
              '''            "contract_generation_skill_grounding_loaded": [],\n            "contract_generation_skill_runtime_injected": False,\n            "contract_generation_skill_runtime_error": "",\n            "contract_generation_write_stage": "",\n''',
              'add runtime event state',
          )

          old_ensure_start = text.index('    async def _ensure_runtime_tools(\n')
          old_ensure_end = text.index('    async def _send_progress_once', old_ensure_start)
          new_ensure = '''    async def _ensure_runtime_tools(\n        self,\n        agent: Any,\n        event: AstrMessageEvent,\n    ) -> tuple[list[str], list[str], str]:\n        # HandoffTool/Agent objects are shared across sessions. Only install the\n        # same runtime ToolSet on that shared Agent; never write request-specific\n        # Skill inventory into agent.instructions.\n        async with self._runtime_lock:\n            if agent.tools is not self._runtime_tools:\n                agent.tools = self._runtime_tools\n\n        try:\n            runtime_block, skill_missing = self._prepare_builder_skill_runtime(event)\n            event.set_extra("contract_generation_skill_runtime_error", "")\n        except Exception:\n            logger.exception(\n                "Contract generation flow: failed to prepare Builder Skill runtime"\n            )\n            event.set_extra("contract_generation_document_spec_available", False)\n            event.set_extra(\n                "contract_generation_skill_runtime_error",\n                "builder skill runtime setup failed",\n            )\n            runtime_block = self._skill_runtime_failure_block()\n            skill_missing = [\n                "builder_skill_runtime",\n                "builder_document_spec_skill",\n            ]\n\n        diagnostics = self._runtime_diagnostics(event)\n        event.set_extra("contract_generation_builder_runtime_optional_missing", diagnostics)\n        event.set_extra(ASSET_CORPUS_EVENT_KEY, self.asset_corpus_slug)\n\n        missing = list(skill_missing)\n        if not self._builder_prompt_compatible(agent):\n            missing.append("builder_persona_protocol_v7")\n        return [tool.name for tool in self._runtime_tools], missing, runtime_block\n\n'''
          text = text[:old_ensure_start] + new_ensure + text[old_ensure_end:]

          text = replace_once(
              text,
              '''        agent = getattr(tool, "agent", None)\n        if agent is None:\n            runtime_tools, missing = [], ["builder_agent"]\n        else:\n            runtime_tools, missing = await self._ensure_runtime_tools(agent, event)\n\n        event.set_extra("contract_generation_builder_runtime_tools", runtime_tools)\n''',
              '''        agent = getattr(tool, "agent", None)\n        if agent is None:\n            runtime_tools, missing, runtime_block = [], ["builder_agent"], ""\n        else:\n            runtime_tools, missing, runtime_block = await self._ensure_runtime_tools(agent, event)\n\n        if runtime_block:\n            self._prepend_skill_runtime_input(tool_args, runtime_block)\n            event.set_extra("contract_generation_skill_runtime_injected", True)\n\n        event.set_extra("contract_generation_builder_runtime_tools", runtime_tools)\n''',
              'inject runtime into request input',
          )

          text = replace_once(
              text,
              '''                "diagnostics=%s document_spec_required=%s document_spec_available=%s "\n                "document_spec_loaded=%s tools=%s",\n''',
              '''                "diagnostics=%s document_spec_required=%s document_spec_available=%s "\n                "document_spec_loaded=%s skill_runtime_injected=%s tools=%s",\n''',
              'extend runtime log format',
          )

          text = replace_once(
              text,
              '''                event.get_extra("contract_generation_document_spec_loaded", False),\n                runtime_tools,\n''',
              '''                event.get_extra("contract_generation_document_spec_loaded", False),\n                event.get_extra("contract_generation_skill_runtime_injected", False),\n                runtime_tools,\n''',
              'extend runtime log args',
          )

          path.write_text(text, encoding='utf-8')

          docs = {
              'README.md': [
                  (
                      '''PersonaManager\nSkillManager\nbuild_skills_prompt\n''',
                      '''PersonaManager\nSkillManager\n''',
                  ),
                  (
                      '把 Builder 当前实际绑定、且启用的 Skill inventory 注入子人格。Skill 正文不复制进 Persona 或 Plugin 配置。',
                      '读取 Builder 当前实际绑定且启用的 Skill 元数据，构造不含 Shell/文件路径指令的受限 inventory，并只注入本次 handoff 的 input；不修改共享 `HandoffTool.agent.instructions`。Skill 正文不复制进 Persona 或 Plugin 配置。',
                  ),
              ],
              'docs/architecture/ai-docx-generation.md': [
                  (
                      '''AstrBot SkillManager.list_skills(active_only=true)\n  ↓\nAstrBot build_skills_prompt()\n  ↓\nBuilder instructions\n''',
                      '''AstrBot SkillManager.list_skills(active_only=true)\n  ↓\nGeneration Flow restricted Skill inventory\n  ↓\n本次 handoff input（request-local）\n''',
                  ),
                  (
                      'Skill 正文仍来自 AstrBot Skills 目录。Flow 只提供一个受限 grounding 工具：',
                      'Skill 正文仍来自 AstrBot Skills 目录。Flow 不修改共享 Handoff Agent 的 `instructions`；Skill inventory 只作为本次 handoff 的 request-local input 前缀注入。Flow 只提供一个受限 grounding 工具：',
                  ),
              ],
              'docs/architecture/system-context.md': [
                  (
                      'Generation Flow 0.7.3 因此在 Builder handoff 边界直接复用 AstrBot 的 `PersonaManager + SkillManager + build_skills_prompt()`，把 Builder 实际绑定且启用的 Skill inventory 注入子人格。',
                      'Generation Flow 0.7.3 因此在 Builder handoff 边界复用 AstrBot 的 `PersonaManager + SkillManager` 读取 Builder 实际绑定且启用的 Skill 元数据，生成不含 Shell 指令的受限 inventory，并只注入本次 handoff input；不修改共享 Handoff Agent 的 system prompt。',
                  ),
              ],
              'docs/deployment/persona-manual-config.md': [
                  (
                      'AstrBot 4.23.2 的 handoff 子人格不会自动执行主 Agent 的 Persona Skill 注入流程。Generation Flow 0.7.3 会在 handoff 边界复用 AstrBot 原生 `SkillManager/build_skills_prompt` 注入 Builder 已绑定 Skill，并提供受限运行时工具：',
                      'AstrBot 4.23.2 的 handoff 子人格不会自动执行主 Agent 的 Persona Skill 注入流程。Generation Flow 0.7.3 会在 handoff 边界复用 AstrBot `PersonaManager/SkillManager` 读取 Builder 已绑定且启用的 Skill 元数据，把不含 Shell/任意文件读取指令的受限 inventory 注入本次 handoff input，并提供受限运行时工具：',
                  ),
              ],
              'plugins/astrbot_plugin_contract_generation_flow/README.md': [
                  (
                      'Generation Flow 0.7.3 因此在 Builder handoff 边界使用 AstrBot 原生 `SkillManager` 和 `build_skills_prompt()` 补齐这一层，而不是复制 Skill 内容或维护第二套 Skill 配置。',
                      'Generation Flow 0.7.3 因此在 Builder handoff 边界复用 AstrBot `PersonaManager/SkillManager` 读取实际绑定且启用的 Skill 元数据，构造不含 Shell/文件路径指令的受限 inventory，并只注入本次 handoff input，而不是修改共享 Handoff Agent、复制 Skill 内容或维护第二套 Skill 配置。',
                  ),
                  (
                      'contract_generation_skill_grounding_loaded\ncontract_generation_asset_search_attempted',
                      'contract_generation_skill_grounding_loaded\ncontract_generation_skill_runtime_injected\ncontract_generation_skill_runtime_error\ncontract_generation_asset_search_attempted',
                  ),
              ],
          }

          for filename, replacements in docs.items():
              p = Path(filename)
              content = p.read_text(encoding='utf-8')
              for idx, (old, new) in enumerate(replacements, start=1):
                  content = replace_once(content, old, new, f'{filename} replacement {idx}')
              p.write_text(content, encoding='utf-8')
          PY

      - name: Validate source and release build
        shell: bash
        run: |
          git diff --check
          python -m compileall -q plugins scripts
          python scripts/build_release.py --clean

      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            plugins/astrbot_plugin_contract_generation_flow/main.py \
            plugins/astrbot_plugin_contract_generation_flow/README.md \
            README.md \
            docs/architecture/ai-docx-generation.md \
            docs/architecture/system-context.md \
            docs/deployment/persona-manual-config.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: address PR20 review findings"
          git push origin HEAD:agent/fix-builder-skill-runtime
