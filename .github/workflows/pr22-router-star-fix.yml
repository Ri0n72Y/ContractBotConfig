name: PR22 Router Star ownership fix

on:
  pull_request:
    branches:
      - main
    types: [synchronize, edited]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/shrink-astrbot-runtime-ownership'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shrink-astrbot-runtime-ownership
          fetch-depth: 0
      - name: Make runtime a plain implementation base
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('plugins/astrbot_plugin_contract_file_router/runtime.py')
          text = runtime.read_text(encoding='utf-8')
          replacements = [
              ('from astrbot.api.star import Context, Star\n', 'from astrbot.api.star import Context\n'),
              ('class ContractFileRouter(Star):\n', 'class ContractFileRouter:\n'),
              ('        super().__init__(context, config)\n        config = config or {}\n', '        self.context = context\n        config = config or {}\n'),
              ('Contract file router 0.5.7 initialized', 'Contract file router 0.5.8 initialized'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'runtime replacement not unique: {old!r} count={text.count(old)}')
              text = text.replace(old, new, 1)
          runtime.write_text(text.rstrip() + '\n', encoding='utf-8')

          main = Path('plugins/astrbot_plugin_contract_file_router/main.py')
          text = main.read_text(encoding='utf-8')
          old = 'from astrbot.api import logger\nfrom astrbot.api.event import AstrMessageEvent, filter\n'
          new = 'from astrbot.api import AstrBotConfig, logger\nfrom astrbot.api.event import AstrMessageEvent, filter\nfrom astrbot.api.star import Context, Star\n'
          if text.count(old) != 1:
              raise SystemExit('main import replacement not unique')
          text = text.replace(old, new, 1)
          old = '''class Main(RuntimeContractFileRouter):
    \"\"\"AstrBot Star entrypoint with per-session Router serialization.\"\"\"

    def __init__(self, *args: Any, **kwargs: Any) -> None:
        super().__init__(*args, **kwargs)
        self._intake_locks: dict[str, asyncio.Lock] = {}
'''
          new = '''class Main(Star, RuntimeContractFileRouter):
    \"\"\"Only AstrBot Star entrypoint; runtime.py is a plain implementation base.\"\"\"

    def __init__(
        self,
        context: Context,
        config: AstrBotConfig | None = None,
    ) -> None:
        Star.__init__(self, context, config)
        RuntimeContractFileRouter.__init__(self, context, config)
        self._intake_locks: dict[str, asyncio.Lock] = {}
'''
          if text.count(old) != 1:
              raise SystemExit('main class replacement not unique')
          text = text.replace(old, new, 1)
          main.write_text(text.rstrip() + '\n', encoding='utf-8')

          assert 'class ContractFileRouter(Star)' not in runtime.read_text(encoding='utf-8')
          assert 'star_map' not in main.read_text(encoding='utf-8')
          assert 'class Main(Star, RuntimeContractFileRouter)' in main.read_text(encoding='utf-8')
          PY
      - name: Validate and build
        run: |
          git diff --check
          python -m compileall -q plugins scripts
          python scripts/build_release.py --clean
      - name: Commit fix and remove temporary files
        run: |
          rm -f .pr22-router-trigger
          rm -f .github/workflows/pr22-router-star-fix.yml
          git config user.name "contractbot-ci"
          git config user.email "contractbot-ci@users.noreply.github.com"
          git add -- plugins/astrbot_plugin_contract_file_router/runtime.py plugins/astrbot_plugin_contract_file_router/main.py
          git rm -f --ignore-unmatch .pr22-router-trigger .github/workflows/pr22-router-star-fix.yml
          git commit -m "Make File Router runtime a plain base"
          git push origin HEAD:agent/shrink-astrbot-runtime-ownership
