name: Patch versioned Skill ID on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/fix-versioned-skill-id'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-versioned-skill-id
          fetch-depth: 0
      - name: Apply fix
        run: python .github/scripts/patch_versioned_skill.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in (
              'README.md',
              'docs/deployment/persona-manual-config.md',
              'plugins/astrbot_plugin_contract_generation_flow/README.md',
          ):
              p = Path(path)
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
          python -m compileall -q plugins scripts
          python scripts/build_release.py --clean
      - name: Remove temporary files and commit
        run: |
          rm -f .patch-trigger-versioned-skill
          rm -f .github/scripts/patch_versioned_skill.py
          rm -f .github/workflows/patch-versioned-skill-pr.yml
          git config user.name "contractbot-ci"
          git config user.email "contractbot-ci@users.noreply.github.com"
          git add -- \
            plugins/astrbot_plugin_contract_generation_flow/main.py \
            plugins/astrbot_plugin_contract_generation_flow/metadata.yaml \
            plugins/astrbot_plugin_contract_generation_flow/README.md \
            README.md VERSIONS.md \
            docs/architecture/ai-docx-generation.md \
            docs/architecture/system-context.md \
            docs/deployment/persona-manual-config.md \
            .patch-trigger-versioned-skill \
            .github/scripts/patch_versioned_skill.py \
            .github/workflows/patch-versioned-skill-pr.yml
          git commit -m "Fix versioned Builder Skill IDs"
          git push origin HEAD:agent/fix-versioned-skill-id
