attachment:
  variable name: contractbot_templated_output
  name: ${ document_title }
  filename: contractbot_generated_contract
  docx template file:
    code: |
      contractbot_template_filename
  valid formats:
    - docx
---
attachment:
  variable name: contractbot_generic_output
  name: ${ document_title }
  filename: contractbot_generated_contract
  content: |
    ${ document_body }
  valid formats:
    - docx
---
mandatory: True
code: |
  if template_key in contractbot_template_map:
    contractbot_templated_output
    contractbot_output = contractbot_templated_output
  else:
    contractbot_generic_output
    contractbot_output = contractbot_generic_output
  json_response({
    "contractbot_document": {
      "status": "complete",
      "file_number": contractbot_output.docx.number,
      "filename": "contractbot_generated_contract.docx",
      "extension": "docx",
      "template_key": template_key
    }
  })
