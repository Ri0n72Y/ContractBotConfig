---
metadata:
  title: ContractBot Docassemble API smoke interview
---
attachment:
  variable name: contractbot_output
  name: ${ document_title }
  filename: ${ output_filename }
  content: |
    ${ document_body }
  valid formats:
    - docx
---
mandatory: True
code: |
  contractbot_output
  json_response({
    "contractbot_document": {
      "status": "complete",
      "file_number": contractbot_output.docx.number,
      "filename": contractbot_output.docx.filename,
      "extension": "docx"
    }
  })
