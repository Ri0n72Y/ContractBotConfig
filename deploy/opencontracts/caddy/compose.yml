services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    container_name: ${CADDY_CONTAINER_NAME:-contractbot-opencontracts-caddy}
    restart: unless-stopped
    environment:
      OPENCONTRACTS_LAN_IP: ${OPENCONTRACTS_LAN_IP}
      OPENCONTRACTS_UPLOAD_WORKER_KEY: ${OPENCONTRACTS_UPLOAD_WORKER_KEY}
    ports:
      - "${OPENCONTRACTS_LAN_IP}:80:80/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - legal-network

networks:
  legal-network:
    external: true
    name: legal-network
